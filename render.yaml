services:
  - type: web
    name: codestream-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: HTTP_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: codestream-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_ORIGINS
        value: https://codestream-frontend.onrender.com
    healthCheckPath: /ready
    plan: free

databases:
  - name: codestream-db
    databaseName: codestream
    plan: free
