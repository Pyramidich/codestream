version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: codestream-test-postgres
    environment:
      POSTGRES_USER: codestream
      POSTGRES_PASSWORD: codestream
      POSTGRES_DB: codestream_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codestream -d codestream_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codestream-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
