services:
  postgres:
    image: postgres:16-alpine
    container_name: codestream-postgres
    environment:
      POSTGRES_USER: codestream
      POSTGRES_PASSWORD: codestream
      POSTGRES_DB: codestream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codestream -d codestream"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codestream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codestream-app
    environment:
      APP_ENV: dev
      HTTP_PORT: 8080
      DATABASE_URL: postgres://codestream:codestream@postgres:5432/codestream?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
